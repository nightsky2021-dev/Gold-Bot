<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خروج | سامانه معاملات طلای آنلاین</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/portal.css' %}">
    <style>
        .logout-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .logout-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 12px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logout-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
        }
        .logout-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 1rem;
        }
        .logout-message {
            font-size: 1.1rem;
            color: #757575;
            margin-bottom: 2rem;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logout-card">
            <div class="logout-icon">✅</div>
            <h1 class="logout-title">خروج موفق</h1>
            <p class="logout-message">{{ message|default:"شما با موفقیت خارج شدید." }}</p>
            <p class="logout-message font-small">برای ورود مجدد، از ربات تلگرام استفاده کنید.</p>
            <a href="https://t.me/YOUR_BOT_USERNAME" class="btn btn-primary">بازگشت به ربات تلگرام</a>
        </div>
    </div>
</body>
</html>
