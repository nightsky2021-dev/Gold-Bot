<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطا | سامانه معاملات طلای آنلاین</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/portal.css' %}">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 12px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .error-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
        }
        .error-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #F44336;
            margin-bottom: 1rem;
        }
        .error-message {
            font-size: 1.1rem;
            color: #757575;
            margin-bottom: 2rem;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">❌</div>
            <h1 class="error-title">{{ error_title|default:"خطا" }}</h1>
            <p class="error-message">{{ error_message|default:"متأسفانه خطایی رخ داده است." }}</p>
            <a href="https://t.me/YOUR_BOT_USERNAME" class="btn btn-primary">بازگشت به ربات تلگرام</a>
        </div>
    </div>
</body>
</html>
