version: '3.8'

services:
  # Django Web Application (SQLite)
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env

  # Telegram Bot (SQLite)
  bot:
    build: .
    command: python manage.py runbot
    volumes:
      - .:/app
    env_file:
      - .env
    restart: unless-stopped

