version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: goldshop_db
    environment:
      POSTGRES_DB: gold_shop
      POSTGRES_USER: gold_shop_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold_shop_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goldshop_network

  # Django Web Application
  web:
    build: .
    container_name: goldshop_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://gold_shop_user:${DB_PASSWORD:-changeme123}@db:5432/gold_shop
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goldshop_network

  # Telegram Bot
  bot:
    build: .
    container_name: goldshop_bot
    command: python manage.py runbot
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://gold_shop_user:${DB_PASSWORD:-changeme123}@db:5432/gold_shop
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - goldshop_network

  # Price Update Service (Cron-like)
  price_updater:
    build: .
    container_name: goldshop_price_updater
    command: >
      sh -c "while true; do
        python manage.py update_prices;
        sleep 3600;
      done"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://gold_shop_user:${DB_PASSWORD:-changeme123}@db:5432/gold_shop
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - goldshop_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  goldshop_network:
    driver: bridge
